name: Fix portrait hero and render content directly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-portrait-hero.yml'

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refactor hero and portrait responsive layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          component_path = Path('src/components/HomePageDesign.astro')
          component = component_path.read_text()

          old_hero = '''        <div class="hero-content">
          <img src={logo} alt="Shriram Samruddhi Durga Pujo 20th Year Celebrations" class="hero-logo" />
          <h1>Shriram Samruddhi Durga Pujo 2026</h1>
          <p class="hero-values">Faith <span>|</span> Culture <span>|</span> Community <span>|</span> Together for 20 Glorious Years</p>
          <div class="hero-rule" aria-hidden="true"></div>
          <div class="event-date"><span>▣</span><strong>15 – 21 October 2026</strong></div>
          <p class="event-place"><span>●</span> Shriram Samruddhi Apartment,<br />Munnekolala, Bengaluru</p>
          <div class="countdown" data-countdown data-target="2026-10-15T00:00:00+05:30">
            <div><strong data-unit="days">--</strong><span>Days</span></div>
            <div><strong data-unit="hours">--</strong><span>Hours</span></div>
            <div><strong data-unit="minutes">--</strong><span>Minutes</span></div>
            <div><strong data-unit="seconds">--</strong><span>Seconds</span></div>
          </div>
          <a class="hero-cta" href="#schedule">Be a Part of the Celebration <span>→</span></a>
        </div>'''

          new_hero = '''        <div class="hero-content hero-content-production">
          <p class="hero-bengali-line">আলো, আনন্দ, ভোগ আর বিজয়ার বন্ধনে</p>

          <div class="hero-event-info" aria-label="Durga Pujo dates and venue">
            <div class="hero-event-ornament" aria-hidden="true">
              <i></i>
              <span>◇ ❖ ◇</span>
              <i></i>
            </div>

            <div class="hero-event-row hero-event-date">
              <svg class="hero-event-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 2v3M17 2v3M4.5 8.5h15M5.5 4h13A1.5 1.5 0 0 1 20 5.5v14a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5v-14A1.5 1.5 0 0 1 5.5 4Z" />
                <path d="M8 12h2v2H8zM14 12h2v2h-2zM8 16h2v2H8zM14 16h2v2h-2z" class="icon-fill" />
              </svg>
              <strong>15 – 21 October 2026</strong>
            </div>

            <div class="hero-event-row hero-event-location">
              <svg class="hero-event-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 22s7-6.2 7-13a7 7 0 1 0-14 0c0 6.8 7 13 7 13Z" />
                <circle cx="12" cy="9" r="2.35" class="icon-fill" />
              </svg>
              <span>Shriram Samruddhi Apartment,<br />Munnekolala, Bengaluru</span>
            </div>
          </div>

          <div
            class="hero-pujo-countdown"
            id="hero-pujo-countdown"
            role="timer"
            aria-live="polite"
            aria-label="Countdown to Durga Pujo on 15 October 2026 at 5 PM IST"
          >
            <div class="countdown-cell"><strong data-pujo-unit="days">--</strong><span>Days</span></div>
            <div class="countdown-cell"><strong data-pujo-unit="hours">--</strong><span>Hours</span></div>
            <div class="countdown-cell"><strong data-pujo-unit="minutes">--</strong><span>Minutes</span></div>
          </div>
        </div>'''

          if old_hero not in component:
              raise SystemExit('Expected legacy hero-content block was not found')
          component = component.replace(old_hero, new_hero, 1)

          # Keep only the mobile-menu behaviour here. Countdown is owned by index.astro.
          component, count = re.subn(
              r'''<script>\s*const menuButton = document\.querySelector\('\[data-menu-button\]'\);[\s\S]*?</script>\s*$''',
              '''<script>\n  const menuButton = document.querySelector('[data-menu-button]');\n  const mobileMenu = document.querySelector('[data-mobile-menu]') as HTMLElement | null;\n  menuButton?.addEventListener('click', () => {\n    if (mobileMenu) mobileMenu.hidden = !mobileMenu.hidden;\n  });\n</script>\n''',
              component,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected component script block was not found')
          component_path.write_text(component)

          index_path = Path('src/pages/index.astro')
          index = index_path.read_text()

          # Remove the runtime template entirely: final hero content now renders directly in HomePageDesign.
          index, count = re.subn(
              r'''\n  <!--\n    Single production hero-content block\.[\s\S]*?</template>\n''',
              '\n',
              index,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected runtime hero template was not found in index.astro')

          direct_countdown = '''  <script is:inline>
    (() => {
      const widget = document.querySelector(".home-shell #hero-pujo-countdown");
      if (!widget) return;

      const target = new Date("2026-10-15T17:00:00+05:30").getTime();
      const setValue = (unit, value, pad = false) => {
        const el = widget.querySelector(`[data-pujo-unit="${unit}"]`);
        if (el) el.textContent = pad ? String(value).padStart(2, "0") : String(value);
      };

      const update = () => {
        const remaining = Math.max(0, target - Date.now());
        const totalMinutes = Math.floor(remaining / 60000);
        const days = Math.floor(totalMinutes / 1440);
        const hours = Math.floor((totalMinutes % 1440) / 60);
        const minutes = totalMinutes % 60;

        setValue("days", days);
        setValue("hours", hours, true);
        setValue("minutes", minutes, true);
      };

      update();
      window.setInterval(update, 1000);
    })();
  </script>'''

          index, count = re.subn(
              r'''  <script is:inline>[\s\S]*?</script>''',
              direct_countdown,
              index,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected inline runtime replacement script was not found')

          portrait_override = r'''

  /* Portrait-only fix. Desktop and landscape rules above remain unchanged. */
  @media (max-width: 600px) and (orientation: portrait) {
    .home-shell .hero-scene {
      aspect-ratio: auto !important;
      height: clamp(500px, 145vw, 620px) !important;
      min-height: 500px !important;
      max-height: 620px !important;
    }

    .home-shell .hero-art {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      object-position: 50% 0% !important;
      transform: none !important;
    }

    .home-shell .hero-content.hero-content-production {
      top: 57.5% !important;
      bottom: auto !important;
      width: min(88%, 390px) !important;
      transform: translateX(-50%) !important;
    }

    .home-shell .hero-bengali-line {
      margin-bottom: 8px !important;
      font-size: clamp(16px, 4.7vw, 20px) !important;
      line-height: 1.2 !important;
      white-space: normal !important;
      text-wrap: balance;
    }

    .home-shell .hero-event-info {
      width: min(96%, 350px) !important;
      margin-bottom: 10px !important;
    }

    .home-shell .hero-event-ornament {
      margin-bottom: 6px !important;
    }

    .home-shell .hero-event-date strong {
      font-size: clamp(13px, 3.8vw, 16px) !important;
    }

    .home-shell .hero-event-location span {
      font-size: clamp(9.5px, 2.75vw, 12px) !important;
      line-height: 1.12 !important;
    }

    .home-shell .hero-pujo-countdown {
      width: min(290px, 86%) !important;
    }

    .home-shell .hero-pujo-countdown .countdown-cell {
      min-height: 48px !important;
      padding: 5px 5px 4px !important;
    }

    .home-shell .hero-pujo-countdown strong {
      font-size: clamp(19px, 5.7vw, 24px) !important;
    }

    .home-shell .hero-pujo-countdown span {
      margin-top: 4px !important;
      font-size: 7px !important;
      letter-spacing: 0.11em !important;
    }
  }

  @media (max-width: 380px) and (orientation: portrait) {
    .home-shell .hero-scene {
      height: 520px !important;
      min-height: 520px !important;
    }

    .home-shell .hero-content.hero-content-production {
      top: 56.8% !important;
      width: 90% !important;
    }
  }
'''

          if '/* Portrait-only fix. Desktop and landscape rules above remain unchanged. */' not in index:
              index = index.replace('\n</style>', portrait_override + '\n</style>', 1)

          index_path.write_text(index)
          PY

      - name: Verify cleanup
        run: |
          grep -q 'hero-content hero-content-production' src/components/HomePageDesign.astro
          ! grep -q 'hero-content-template' src/pages/index.astro
          ! grep -q 'legacyContent.replaceWith' src/pages/index.astro
          grep -q 'orientation: portrait' src/pages/index.astro
          grep -q '2026-10-15T17:00:00+05:30' src/pages/index.astro

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomePageDesign.astro src/pages/index.astro
          git commit -m "Fix portrait hero and render overlay directly"
          git push
